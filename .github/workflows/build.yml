name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test unitari
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compila APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: spese-mediche-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Pubblica l'APK come release scaricabile
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SpeseMediche.apk
          gh release delete ultima-versione --yes --cleanup-tag || true
          gh release create ultima-versione SpeseMediche.apk \
            --title "Spese Mediche - ultima versione" \
            --notes "APK compilato automaticamente dal commit ${{ github.sha }}. Scarica SpeseMediche.apk e aprilo sul dispositivo Android."
